# hair.toml - the girl base's hair: a chin-length bob with pointed bangs and side locks (mkmmd/model/parts/hair_head.py;
# docs/hair_part.md has every key). The twin braids with bows, the cat ears and the two cat tails are built by the same
# part and switched off here; the rin example switches them on. Colours: [colors.hair], [colors.ears], [colors.black].
[hair]
seed = 1
dynamic = true                 # rigid bodies + joints for every chain (MMD Bullet); mk's strand solver reads the same chains

[hair.volume]                  # how far the hair stands off the skin (m): crown, front (forehead), side (temples), back
top = 0.036
front = 0.020
side = 0.034
back = 0.027
lift = 0.016                   # crown puff: a bump (m) around lift_deg from the crown, stronger at the back
lift_deg = 28.0
lift_width_deg = 20.0
lift_back = 0.5

[hair.ring]                    # the baked angel ring: a thin warm highlight on the upper crown, broken by the clumps
drop = 0.050                   # metres below the top of the hair
width = 0.015                  # half width of the soft sheen band (m)

[hair.bangs]
count = 11                     # separate pointed clumps in the front layer (a darker back layer of count - 1 sits behind)
above_eye = 0.027              # the mean tip line: this far above the upper-lid top (tips vary +- var; the eyes stay open, the brows show)
var = 0.005                    # tip height variation (m)

[hair.bangs.shadow]            # the cel-shaded shadow of the fringe on the forehead (two steps in the skin's material)
enabled = true

[hair.braids]                  # twin braids from behind the ears, tied with bows
enabled = false

[hair.ears]                    # cat ears on the crown
enabled = false

[hair.tails]                   # two cat tails from the lower back
enabled = false
