# head.toml - the girl base's face: generated by the head part (source = "param": mkmmd/model/parts/head_shape.py, the
# eyes, lids, brows and mouth of docs/head_part.md) from the face layout of [proportions.face].
[head]
source = "param"

# the face outline (head-local (height, half width), see head_shape.ANCHORS): a little fuller at the cheeks and the jaw than
# the measured widths of [proportions.head] (cheek 0.0710, mouth 0.0599, chin 0.0294): a soft, round lower face, the jaw's
# keel (head_shape FACE jaw) narrows it to the chin seen from below
[head.shape]
cheek = [0.0219, 0.0735]
mouth = [0.0029, 0.0615]
chin = [-0.0171, 0.0300]

# her own eye drawing, softer than Rin's (head_eye.UPPER_LASH, LASH_WING, LASH_FORK are Rin's): a short, low wing, a
# small fork at the inner end, a thinner band that runs less far down the outer side. The closed eye follows: its flick
# scales with out_v (head_lid.closed_flick). bases/rin/head.toml puts Rin's drawing back.
[head.lash]
width = 0.0072
out_v = -0.0030
out_tip = 24.0

[head.lashwing]
length = 0.0055
angle = 40.0

[head.lashfork]
length = 0.0030
