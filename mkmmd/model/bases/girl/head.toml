# head.toml - the girl base's face: generated by the head part (source = "param": mkmmd/model/parts/head_shape.py, the
# eyes, lids, brows and mouth of docs/head_part.md) from the face layout of [proportions.face].
[head]
source = "param"

# the face outline (head-local (height, half width), see head_shape.ANCHORS): a little fuller at the cheeks and the jaw than
# the measured widths of [proportions.head] (cheek 0.0710, mouth 0.0599, chin 0.0294): a soft, round lower face, the jaw's
# keel (head_shape FACE jaw) narrows it to the chin seen from below
[head.shape]
cheek = [0.0219, 0.0735]
mouth = [0.0029, 0.0615]
chin = [-0.0171, 0.0300]
