# proportions.toml - the girl base's proportions: every size of the body, the head outline and the face layout (the head
# part's [proportions.face]), and the guide heights of the hair and the outfit. Every key is read by a part: the build
# warns about keys no part reads.
#
# Where the numbers come from: they were made for Rin (the rin example builds on this base) from Miy's Reisen model, by
# measuring it, never by copying its mesh: every number is Reisen's measured number (tools/measure.py on her rest pose)
# scaled, S_BODY = 0.95 below the head pivot and S_HEAD = 0.985 for the head (about the pivot). The comments below still
# speak of Rin and Reisen; keep this note when the base is shared.
#
# Everything lives under [proportions.*] so it cannot collide with the part files' own tables. Model space: metres, Z up,
# the character faces -Y, feet on z = 0, centred on x = 0, her LEFT is +X.  Only the left (.L) side is listed; .R is the
# x-mirror.
#
# HEIGHT: crown (hair top, ears excluded) 1.427 m = 95.5 % of Reisen's 1.494 m; the head is 98.5 % of Reisen's absolute
# size on a 95 % body = 5.41 heads tall (Reisen 5.58): a slightly bigger head reads cuter and keeps the face layout, eye
# size and style. Seats, steering wheels and grips of the mk pipeline are made for this size. A character taller in the
# legs sets `leg_extra = 0.03` in [proportions] (mkmmd/model/proportions.py moves every height above the hip with them).


[proportions.landmarks]
# Head positions of the standard bones, named like mkmmd/core/bonemap.py (.R = mirror of .L); the model's skeleton
# (mkmmd.model.skeleton.standard_bones) takes these.  head_tip = end of the head bone; toe.L = ball of the foot,
# toe_end.L = front of the foot at the floor; eye.L = eyeball-sphere centre (RinHead's pivot); eyes = the 両目 control bone above the face.
# No finger joints: Rin's hands have their own design (the generated body's [body.hand], mkmmd body_hand.DESIGN), and
# the finger joints are made from it at the wrist.

root = [0.0000, -0.0027, -0.0036]
center = [0.0000, -0.0167, 0.8419]
groove = [0.0000, -0.0167, 0.8564]
waist = [0.0000, -0.0508, 0.8823]
