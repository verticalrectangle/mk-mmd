[proportions.sections.foot]
# Shoe (with a small heel) and the foot inside it, one side: length (y), width (x), and the heel/sole height.  Reisen's rest
# foot is plantarflexed (34 deg ankle to ball), the pipeline's leg IK expects that.
shoe_length = 0.1950
shoe_width = 0.0814
shoe_y = [-0.1475, 0.0475]      # toe (front) .. heel (back)
shoe_x = [0.0174, 0.0989]
sole_z = 0.0
foot_length = 0.1696
foot_width = 0.0700
foot_inner_floor_z = 0.0229

[proportions.head]
# The head as Reisen draws it (an inverted egg: widest at the temples, narrow pointed chin), scaled about the pivot.
crown_skull = 1.3988
chin_point = [-0.0811, 1.1778]       # [y, z] of the front-lowest chin point
forehead_front = [-0.1135, 1.3206]   # [y, z] front-most skull point
width_max = 0.1895                   # skull width at the temples, z = 1.325
width_eye_level = 0.1653
width_cheek = 0.1421                   # z = 1.226
width_mouth = 0.1198                   # z = 1.207
width_chin = 0.0588                    # z = 1.187
# Named widths above (temples, eye level, cheeks, mouth, chin) and the named points (forehead, chin point; the nose tip is
# [proportions.face] nose_tip) are the whole description of the head outline: proportions only, no dense outline tables.

[proportions.face]
# Face layout, absolute metres.  Reisen's values are in the comments.  Style: huge eyes at the face's full width, set LOW (41 %
# up from the chin), a tiny mouth and a hint of a nose, brows faint and mostly under the bangs.
eye_z = 1.2604                         # eye centre height (Reisen 1.3246)
eye_x = 0.0476                          # eyeball centre x (Reisen 0.0483); iris centre x = 0.0422 (slightly cross-eyed, Reisen 0.0428)
brow_z = 1.3036                            # brow line (Reisen +0.043 above the eye centre)
brow_x = [0.0256, 0.0768]                    # inner .. outer end of the brow, per side
nose_tip = [-0.1188, 1.2321]          # [y, z]; protrudes 0.0164 past the face plane
mouth_z = 1.2051                          # closed-mouth line centre (Reisen 1.2685)
mouth_width = 0.0453                        # closed (Reisen ~0.048); corners lifted 0.0030

[proportions.hair_guides]
# Where the hair meets the head: the head part reads these and passes them on to the hair (hairline) and the cat ears. The
# hair's lengths are the hair part's own keys ([hair.bangs] above_eye, [hair.back] end_above_chin, ...: docs/hair_part.md).
hairline_centre_z = 1.3869          # where the bangs start on the crown (the forehead is hidden by bangs)
hairline_temple = [0.0936, 1.3297]        # [x, z] hairline at the temples
cat_ear_base = [0.0709, -0.0294, 1.3638]       # [x, y, z] base centre on the skull top, per side
cat_ear_tilt_out_deg = 12.0

[proportions.outfit_guides]
# Heights for the outfit, derived from the body above: the stand collar's top and the sash (the skirt, cuffs and ribbon
# fit themselves to the body).
collar_top_z = 1.1593           # stand collar tops out just under the jaw
sash_z = 0.9310                           # at the narrowest cut
