# colors.toml - the girl base's palette: sRGB hex, one comment per entry. The parts read [colors.skin] (the face, the hair's
# skin seams; the body's own skin colours are body.toml's [body] skin), [colors.hair], [colors.eyes] and [colors.mouth]
# (head, hair), [colors.ears] (cat ears and tails, when switched on), [colors.black] (ribbons, shoes) and [colors.accent];
# the dress takes [colors.outfit] (outfit.toml). The skin, mouth and blacks are Rin's (sampled from studio renders of
# Reisen's skin as reflectance, see the rin example); the hair, eyes and ears are a neutral chestnut brown with the same
# tonal structure (in HSV value: shadow about 0.6 of the base, deep about 0.4, light about 1.3, highlight about 1.8).
# Rule: no pure #000000 anywhere; the darkest allowed value is #0b0a0d.

[colors.skin]
base = "#f0e6d5"           # lit skin mid-tone: pale warm cream
outline = "#8a6a62"        # face/skin outline (edge) colour: warm grey-brown, never black

[colors.hair]
base = "#74493a"           # chestnut brown
shadow = "#43271f"         # clump shadow / under-layers
deep = "#2a1712"           # roots, scalp seam, inside of the braids
light = "#93604b"          # lit side of the clumps, a touch warmer than base
highlight = "#d6a68a"      # specular band across the crown and bang tips: pale warm beige
highlight_core = "#f2d8c4" # brightest centre of the highlight, only a thin streak
toon_shadow_multiplier = [0.48, 0.47, 0.56]   # hair toon ramp: shadow = base x this (slightly blue-shifted)
rim = "#c08a6e"            # thin back-light rim on the outer edge of the side locks and braids (sphere map)

[colors.eyes]
sclera = "#f6f1f2"         # eyeball white (slightly warm); never pure white so the highlights stay brighter
sclera_shadow = "#cfc8d6"  # lid shadow across the top of the eyeball and the outer corners (lavender grey)
iris_top = "#24130b"       # gradient, top (under the upper lid): very dark brown
iris_upper = "#5c3216"     # upper-middle: deep brown
iris_mid = "#8f5523"       # middle: warm brown, the dominant iris colour
iris_lower = "#cf9049"     # lower glow: amber
iris_rim = "#f6d7ad"       # bottom rim light, thin: pale honey
iris_ring = "#4d2a12"      # dark ring around the pupil
pupil = "#170b05"          # pupil: a vertical oval, very dark brown
highlight_glow = "#f6dcc0" # soft tinted secondary glow along the lower iris edge
lash = "#25140e"           # heavy upper lash line and flick: near-black brown
lash_lower = "#6a4535"     # thin lower lash line (lighter and thinner than the upper)
brow = "#5e3b2c"           # eyebrows: brown, faint, mostly hidden under the bangs
lid_crease = "#c97b6c"     # soft skin-toned fold line above the eye when open wide

[colors.ears]
outer = "#5c3a2d"          # cat ears (off in the base), outside and rim: the hair's brown
outer_sheen = "#7d5444"    # soft sheen along the ear's outer edge
inner = "#c9908a"          # inside of the ear: dusty pink
inner_deep = "#8f5a55"     # the hollow of the ear
tuft = "#f2e1d8"           # the few pale tufts of fur at the ear opening
tuft_shadow = "#c9aea4"    # shaded side of the tufts
tail = "#5f3c2f"           # the cat tails (off in the base): the ears' brown, slightly lifted
tail_tip_sheen = "#83594a" # sheen along the top of the tails

[colors.black]
ribbon = "#17151a"         # all black ribbons and bows (throat bow, sash bow, hair bows); never #000000
ribbon_shade = "#0d0c0f"   # darkest value anywhere in the model
ribbon_sheen = "#3b363d"   # satin sheen on the loops
shoe = "#1c1a1f"           # black Mary-Jane shoes
shoe_sole = "#0f0e11"      # sole and heel

[colors.mouth]
lip_line = "#c7a19a"       # closed mouth: a thin dusty-rose line
interior = "#7a1824"       # inside of the mouth
tongue = "#e8727f"         # tongue
teeth = "#fffaf2"          # teeth and the fang

[colors.accent]
nail_red = "#c9262d"       # red nails ([body] nails = "red"; off by default)
