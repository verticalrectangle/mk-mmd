[project]
name = "mk-mmd"
version = "0.1.0"
description = "Agent-friendly MMD rigging and set design for Blender: a CLI that poses, simulates, frames, renders and checks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
fast = ["numba>=0.60"]
ref = ["mediapipe>=0.10.14"]
timeline = ["torch==2.5.1", "torchaudio==2.5.1", "demucs>=4.0.1", "faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
mk = "mkmmd.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mkmmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
